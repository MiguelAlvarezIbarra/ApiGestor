# ==============================================================================
# BLUEPRINT DE DESPLIEGUE CLOUD (IaC PaaS) — RENDER CLOUD (COMPATIBLE FREE TIER)
# Proyecto Integrador Final: Circuito DevOps + IaC + Cloud
# Despliega de manera declarativa y gratuita:
#   1. Base de Datos Administrada PostgreSQL (dbgestor-cloud-db)
#   2. Microservicio Backend Java 21 (api-gestor-backend)
#   3. Microservicio Frontend Java 21 (api-cliente-frontend)
# ==============================================================================

databases:
  - name: dbgestor-cloud-db
    databaseName: dbgestor
    user: app_gestor_svc
    plan: free

services:
  - type: web
    name: api-gestor-backend
    runtime: docker
    repo: https://github.com/MiguelAlvarezIbarra/ApiGestor
    branch: main
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8081"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseContainerSupport -Xmx384m"
      - key: DB_HOST
        fromDatabase:
          name: dbgestor-cloud-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dbgestor-cloud-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: dbgestor-cloud-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: dbgestor-cloud-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dbgestor-cloud-db
          property: password

  - type: web
    name: api-cliente-frontend
    runtime: docker
    repo: https://github.com/MiguelAlvarezIbarra/ApiCliente
    branch: main
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8082"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseContainerSupport -Xmx384m"
      - key: API_GESTOR_URL
        sync: false
